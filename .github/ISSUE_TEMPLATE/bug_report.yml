name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [Firmware, aq_simulator, aq_receiver, Portable library, Build / CI, Documentation]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Board (ESP32 / ESP32-S3), ESP-IDF version, host OS and compiler.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behaviour
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Serial monitor output, receiver output or CI log.
      render: text
